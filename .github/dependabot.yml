---
version: 2

multi-ecosystem-groups:
  nightly-dependencies:
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: UTC
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/mint-app-token
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directories:
      - /
      - /release
      - /runtime
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    labels:
      - dependencies
      - docker
