name: Automation App Health

# Weekly proof that the threatflux-automation GitHub App still mints tokens,
# that its installation, the TF_AUTOMATION_APP_PRIVATE_KEY secret and the
# TF_AUTOMATION_APP_ID variable all reach exactly the repositories listed in
# .github/automation-app-repos.txt, and an audit of the organization secrets
# behind it, including the App key's age from its rotation record. Findings go
# to a single tracking issue (label secret-rotation) that closes itself once
# everything is healthy.
# scripts/rotate-automation-app-key.sh dispatches this workflow to prove a
# freshly rotated key works before the old one is deleted.
# Runbook: docs/SECRETS-ROTATION.md.
#
# There is deliberately no pull_request trigger: a pull request runs its own
# version of this file, and this job holds the organization App private key.
# scripts/test_automation_app_health.py covers the evaluation in CI instead.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: automation-app-health
  cancel-in-progress: false

env:
  # The repositories the installation, the key secret, and the App ID variable
  # must each reach, no more and no fewer. scripts/rotate-automation-app-key.sh
  # reads the same file.
  REPOS_FILE: .github/automation-app-repos.txt
  APP_KEY_SECRET: TF_AUTOMATION_APP_PRIVATE_KEY
  APP_ID_VARIABLE: TF_AUTOMATION_APP_ID
  KEY_MAX_AGE_DAYS: "90"
  SECRET_MAX_AGE_DAYS: "180"
  ISSUE_LABEL: secret-rotation
  ISSUE_TITLE: Automation App health and secret rotation

jobs:
  audit:
    name: App token and secret audit
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read # check out the evaluation script
      issues: write # open, update, or close the tracking issue
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Metadata is enough to list the installation's repositories; the token
      # carries nothing else. It has to span every installed repository, or
      # GET /installation/repositories would only ever return this one. A
      # failure here is the finding that matters most, so it is recorded
      # rather than allowed to stop the run.
      - name: Mint an App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TF_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] metadata-only, must see every installed repository
          permission-metadata: read

      - name: List the installation's repositories
        id: repos
        if: steps.app-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api --paginate /installation/repositories --jq '.repositories[].name' | sort > installation-repos.txt
          echo "The installation reaches $(wc -l < installation-repos.txt | tr -d ' ') repositories:"
          cat installation-repos.txt

      # A separate token for the secret audit keeps the first one minimal. The
      # App only holds organization "Secrets: read" once an owner grants it, so
      # a failure to mint this token is reported, never fatal.
      - name: Mint an App token for the organization secret audit
        id: secrets-token
        if: steps.app-token.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TF_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
          # Not narrowed to this repository: the selected-repository list of
          # the key secret is compared against the whole installation.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] organization Secrets: read only
          permission-organization-secrets: read

      - name: Read organization secret metadata
        id: secrets
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.secrets-token.outputs.token }}
          TOKEN_OUTCOME: ${{ steps.secrets-token.outcome }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "${TOKEN_OUTCOME}" != success ]]; then
            echo "::warning title=Organization secret audit skipped::The App could not mint a token with organization Secrets: read. Grant that permission to the App and approve it for the ${ORG} installation; see docs/SECRETS-ROTATION.md."
            echo "outcome=missing-permission" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Names and dates only: the API never returns secret values.
          if ! gh api --paginate "/orgs/${ORG}/actions/secrets" \
            --jq '.secrets[] | {name, created_at, updated_at, visibility}' > org-secrets.jsonl 2> secrets-error.txt; then
            cat secrets-error.txt >&2
            if grep -q 'HTTP 403' secrets-error.txt; then
              echo "::warning title=Organization secret audit skipped::The App token was refused access to the organization's secrets (HTTP 403)."
              echo "outcome=missing-permission" >> "$GITHUB_OUTPUT"
            else
              echo "outcome=failure" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "Read metadata for $(wc -l < org-secrets.jsonl | tr -d ' ') organization secrets."
          if gh api --paginate "/orgs/${ORG}/actions/secrets/${APP_KEY_SECRET}/repositories" \
            --jq '.repositories[].name' 2> key-repos-error.txt | sort > key-secret-repos.txt; then
            echo "${APP_KEY_SECRET} is visible to $(wc -l < key-secret-repos.txt | tr -d ' ') repositories."
          else
            # Not a selected-visibility secret (or missing): the audit names that.
            cat key-repos-error.txt >&2
            rm -f key-secret-repos.txt
          fi
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      # Organization variables need the App's organization permission
      # "Variables: read" (organization_actions_variables), which an owner has
      # to grant. This action release does not declare that permission input,
      # but it forwards every permission-* input to the token request, so the
      # runner's "Unexpected input" warning here is expected. Until the App
      # holds the permission, minting fails and the audit says so.
      - name: Mint an App token for the organization variable audit
        id: variables-token
        if: steps.app-token.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TF_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
          # Not narrowed to this repository: the variable's selected-repository
          # list is compared against the whole installation.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] organization Variables: read only
          permission-organization-actions-variables: read

      - name: Read the App ID variable's repository access
        id: variable
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.variables-token.outputs.token }}
          TOKEN_OUTCOME: ${{ steps.variables-token.outcome }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "${TOKEN_OUTCOME}" != success ]]; then
            echo "::warning title=App ID variable audit skipped::The App could not mint a token with organization Variables: read. Grant that permission to the App and approve it for the ${ORG} installation; see docs/SECRETS-ROTATION.md."
            echo "outcome=missing-permission" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! visibility="$(gh api "/orgs/${ORG}/actions/variables/${APP_ID_VARIABLE}" --jq .visibility 2> variable-error.txt)"; then
            cat variable-error.txt >&2
            if grep -q 'HTTP 404' variable-error.txt; then
              echo "outcome=not-found" >> "$GITHUB_OUTPUT"
            elif grep -q 'HTTP 403' variable-error.txt; then
              echo "outcome=missing-permission" >> "$GITHUB_OUTPUT"
            else
              echo "outcome=failure" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "visibility=${visibility}" >> "$GITHUB_OUTPUT"
          if [[ "${visibility}" == selected ]]; then
            if gh api --paginate "/orgs/${ORG}/actions/variables/${APP_ID_VARIABLE}/repositories" \
              --jq '.repositories[].name' 2> variable-repos-error.txt | sort > app-id-variable-repos.txt; then
              echo "${APP_ID_VARIABLE} is visible to $(wc -l < app-id-variable-repos.txt | tr -d ' ') repositories."
            else
              cat variable-repos-error.txt >&2
              rm -f app-id-variable-repos.txt
            fi
          fi
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      # The SHA256 fingerprint of the stored key ties the rotation record (the
      # TF_AUTOMATION_APP_KEY_FINGERPRINT and TF_AUTOMATION_APP_KEY_ROTATED_AT
      # organization variables the rotation script writes) to the key actually
      # in the secret, and is the value the App's settings page shows for it.
      # Only the public half is hashed; printf is a shell builtin, so the key
      # never appears on a command line, and the runner masks it in the log.
      - name: Fingerprint the stored App key
        id: key
        if: steps.app-token.outcome == 'success'
        continue-on-error: true
        env:
          APP_PRIVATE_KEY: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Stored keys sometimes carry literal \n sequences instead of newlines.
          digest="$(printf '%s\n' "${APP_PRIVATE_KEY//\\n/$'\n'}" \
            | openssl rsa -passin pass: -pubout -outform DER 2>/dev/null \
            | openssl dgst -sha256 -binary | openssl base64 -A)"
          echo "Stored key fingerprint: SHA256:${digest}"
          echo "fingerprint=SHA256:${digest}" >> "$GITHUB_OUTPUT"

      - name: Evaluate
        id: evaluate
        if: always()
        env:
          OWNER: ${{ github.repository_owner }}
          MINT_OUTCOME: ${{ steps.app-token.outcome }}
          REPOS_OUTCOME: ${{ steps.repos.outcome || 'skipped' }}
          SECRETS_OUTCOME: ${{ steps.secrets.outputs.outcome || 'skipped' }}
          VARIABLE_OUTCOME: ${{ steps.variable.outputs.outcome || 'skipped' }}
          VARIABLE_VISIBILITY: ${{ steps.variable.outputs.visibility }}
          KEY_FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
          # Written by scripts/rotate-automation-app-key.sh and shared with this
          # repository; empty until the first recorded rotation.
          RECORDED_FINGERPRINT: ${{ vars.TF_AUTOMATION_APP_KEY_FINGERPRINT }}
          RECORDED_ROTATED_AT: ${{ vars.TF_AUTOMATION_APP_KEY_ROTATED_AT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # --obsolete names a secret that is being retired and should be
          # deleted; --deleted names one that was deleted (on 2026-10-07 for
          # the six below) and must not come back. docs/SECRETS-ROTATION.md
          # lists both.
          python3 scripts/automation_app_health.py \
            --owner "${OWNER}" \
            --expected-repos-file "${REPOS_FILE}" \
            --mint-outcome "${MINT_OUTCOME}" \
            --repos-outcome "${REPOS_OUTCOME}" \
            --repos-file installation-repos.txt \
            --secrets-outcome "${SECRETS_OUTCOME}" \
            --secrets-file org-secrets.jsonl \
            --key-secret "${APP_KEY_SECRET}" \
            --key-secret-repos-file key-secret-repos.txt \
            --app-id-variable "${APP_ID_VARIABLE}" \
            --variable-outcome "${VARIABLE_OUTCOME}" \
            --variable-visibility "${VARIABLE_VISIBILITY}" \
            --variable-repos-file app-id-variable-repos.txt \
            --key-fingerprint "${KEY_FINGERPRINT}" \
            --recorded-fingerprint "${RECORDED_FINGERPRINT}" \
            --recorded-rotated-at "${RECORDED_ROTATED_AT}" \
            --health-repo "${GITHUB_REPOSITORY#*/}" \
            --key-max-age-days "${KEY_MAX_AGE_DAYS}" \
            --max-age-days "${SECRET_MAX_AGE_DAYS}" \
            --obsolete "GIT_TOKEN=Classic personal access token that GitHub now rejects (401). Nothing may use it: replace the remaining references (lifeflux workflows) with GITHUB_TOKEN or a GitHub App token, then delete the secret." \
            --obsolete "CODECOV_TOKEN=Being retired, so do not rotate it: Codecov uploads move to OIDC (use_oidc: true on codecov/codecov-action, with id-token: write). Move the workflows that still read it to OIDC, then delete the secret and regenerate the upload token in Codecov." \
            --not-credential DOCKERHUB_USERNAME \
            --deleted CARGO_REGISTRY_TOKEN \
            --deleted CODACY_API_TOKEN \
            --deleted CODACY_ORGANIZATION_PROVIDER \
            --deleted CODACY_USERNAME \
            --deleted PUB_DEV_CREDENTIALS \
            --deleted SAFETY_API_KEY \
            --run-url "${RUN_URL}" \
            --repo-url "${REPO_URL}" \
            --report health-report.md
          cat health-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update, or close the tracking issue
        if: always() && steps.evaluate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.evaluate.outputs.status }}
          FINDINGS: ${{ steps.evaluate.outputs.findings }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # One issue for the life of the repository, identified by the label
          # and the marker comment this workflow writes into its body (the
          # label alone could match an unrelated issue). The newest such issue
          # is reused, reopened, or closed; other issues are never touched.
          # gh issue list --label goes through issue search, which misses an
          # issue for a minute or two after it is created, so the newest issues
          # are also listed directly: back-to-back runs (a key rotation right
          # after a scheduled run) must not open a duplicate.
          tracker='[.[] | select(any(.labels[]; .name == env.ISSUE_LABEL))
            | select(.body | contains("<!-- automation-app-health -->"))] | .[0] | select(. != null)
            | "\(.number) \(.state)"'
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all --limit 100 \
            --json number,state,body,labels --jq "${tracker}")"
          if [[ -z "${existing}" ]]; then
            existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --label "${ISSUE_LABEL}" --state all --limit 100 \
              --json number,state,body,labels --jq "${tracker}")"
          fi
          number="${existing%% *}"
          state="${existing#* }"

          if [[ "${STATUS}" == healthy ]]; then
            if [[ -n "${existing}" && "${state}" == OPEN ]]; then
              gh issue close "${number}" --repo "${GITHUB_REPOSITORY}" \
                --comment "Healthy as of ${RUN_URL}: the App mints tokens; its installation, key secret, and App ID variable reach exactly the repositories in ${REPOS_FILE}; and no secret needs attention. Closing."
              echo "Closed #${number}." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Healthy; no open tracking issue." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          gh label create "${ISSUE_LABEL}" --repo "${GITHUB_REPOSITORY}" --force --color B60205 \
            --description "Tracked by automation-app-health.yml; see docs/SECRETS-ROTATION.md"
          if [[ -z "${existing}" ]]; then
            url="$(gh issue create --repo "${GITHUB_REPOSITORY}" --title "${ISSUE_TITLE}" \
              --label "${ISSUE_LABEL}" --body-file health-report.md)"
            echo "Opened ${url} (${STATUS}, ${FINDINGS} findings)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh issue edit "${number}" --repo "${GITHUB_REPOSITORY}" --title "${ISSUE_TITLE}" --body-file health-report.md
          if [[ "${state}" != OPEN ]]; then
            gh issue reopen "${number}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Reopened by ${RUN_URL}: ${FINDINGS} findings (${STATUS})."
            echo "Reopened #${number} (${STATUS}, ${FINDINGS} findings)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Updated #${number} (${STATUS}, ${FINDINGS} findings)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail when the App is broken
        if: always() && steps.evaluate.outputs.status == 'broken'
        run: |
          echo "::error title=Automation App broken::The App cannot mint a token, or its installation, key secret, or App ID variable reaches other repositories than ${REPOS_FILE}; see the job summary."
          exit 1
