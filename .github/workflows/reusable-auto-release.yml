name: Reusable Auto Release

# Callable release workflow. It owns the common CI gate and optional
# workflow-dispatch chaining so consuming repositories only declare their
# triggers and repository-specific pipeline names.
#
# Which token cuts the release decides whether dispatch-workflows run:
# - GitHub App (github-app-id + github-app-private-key): the tag push is an
#   ordinary push, so the caller's `on: push: tags` workflows start by
#   themselves and nothing is dispatched (set dispatch-on-app-token for
#   workflows without a tag trigger). Release pull requests the App opens
#   start the caller's pull_request CI the same way.
# - release-token or the default GITHUB_TOKEN: dispatch-workflows are
#   dispatched on the new tag, because a GITHUB_TOKEN tag starts nothing.

on:
  workflow_call:
    inputs:
      bump:
        description: Version bump strategy (auto, major, minor, patch).
        required: false
        default: auto
        type: string
      tag-prefix:
        description: Prefix for release tags.
        required: false
        default: v
        type: string
      update-major-alias:
        description: Also move the moving major alias tag to the new release.
        required: false
        default: false
        type: boolean
      notes-file:
        description: Path where generated release notes are written.
        required: false
        default: release_notes.md
        type: string
      dry-run:
        description: >-
          Compute and log the would-be version, tag, and file rewrites without pushing a commit, branch, tag, pull request, or GitHub Release, and
          without dispatching workflows. The required-workflows gate still applies.
        required: false
        default: false
        type: boolean
      create-pr:
        description: Create or update an automated release branch and pull request instead of publishing directly.
        required: false
        default: false
        type: boolean
      release-branch:
        description: Automation-owned release branch (automation/release or automation/release/*).
        required: false
        default: automation/release
        type: string
      required-workflows:
        description: Comma-separated workflow names that must pass for the target commit.
        required: false
        default: ""
        type: string
      dispatch-workflows:
        description: Comma-separated workflow files to dispatch after a release.
        required: false
        default: ""
        type: string
      dispatch-version-workflow:
        description: Optional workflow file that receives the released version as a version input.
        required: false
        default: ""
        type: string
      dispatch-on-app-token:
        description: >-
          Also run dispatch-workflows when the GitHub App token cut the release. Leave false (the default) when those workflows trigger on
          `push: tags`: a tag the App pushes starts them by itself, so dispatching them again would run each one twice. Set true only for
          dispatch-workflows that have no tag trigger. The release-token and GITHUB_TOKEN paths always dispatch.
        required: false
        default: false
        type: boolean
      github-app-id:
        description: >-
          Optional GitHub App ID (or client ID). Pair with github-app-private-key to cut releases, push the release branch, and open release
          pull requests as the App, so the tag and the pull request start the caller's workflows.
        required: false
        default: ""
        type: string
    secrets:
      release-token:
        description: >-
          Optional token used when no GitHub App is configured; falls back to GITHUB_TOKEN. dispatch-workflows are still dispatched on this
          path, so if this token's tag push already triggers those workflows, leave dispatch-workflows empty.
        required: false
      github-app-private-key:
        description: Private key for the GitHub App identified by github-app-id. Store it as an organization or repository secret.
        required: false
    outputs:
      released:
        description: Whether a release was created (true or false).
        value: ${{ jobs.release.outputs.released }}
      version:
        description: The released version without the tag prefix.
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: The created release tag.
        value: ${{ jobs.release.outputs.tag }}
      release-url:
        description: URL of the created GitHub Release.
        value: ${{ jobs.release.outputs.release-url }}
      release-pr-number:
        description: Number of the created or updated automated release pull request.
        value: ${{ jobs.release.outputs.release-pr-number }}
      release-pr-url:
        description: URL of the created or updated automated release pull request.
        value: ${{ jobs.release.outputs.release-pr-url }}
      release-branch:
        description: Branch used for the automated release pull request.
        value: ${{ jobs.release.outputs.release-branch }}

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Check release prerequisites
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should-release: ${{ steps.gate.outputs.should-release }}
      target-sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve target commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            [[ "$WORKFLOW_RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid workflow-run head SHA" >&2; exit 1; }
            echo "sha=$WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify required workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REQUIRED_WORKFLOWS: ${{ inputs.required-workflows }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run && ( "$TRIGGER_CONCLUSION" != success || "$TRIGGER_REPOSITORY" != "$GITHUB_REPOSITORY" ) ]]; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$REQUIRED_WORKFLOWS" ]]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=',' read -ra workflows <<< "$REQUIRED_WORKFLOWS"
          for workflow in "${workflows[@]}"; do
            workflow="$(xargs <<< "$workflow")"
            [[ -n "$workflow" ]] || continue
            conclusion="$(gh run list --workflow="$workflow" --commit="$TARGET_SHA" --limit=1 --json conclusion --jq '.[0].conclusion // ""')"
            if [[ "$conclusion" != success ]]; then
              echo "Required workflow '$workflow' is '$conclusion' for $TARGET_SHA"
              echo "should-release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "should-release=true" >> "$GITHUB_OUTPUT"
  release:
    name: Auto Release
    needs: check
    if: needs.check.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      # The `secrets` context is not available to a step-level `if:`, so the
      # presence of the App key is surfaced here, where `secrets` is allowed,
      # and the steps below branch on this value instead.
      HAS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.github-app-private-key != '' }}
      HAS_RELEASE_TOKEN: ${{ secrets.release-token != '' }}
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release-url: ${{ steps.release.outputs.release-url }}
      release-pr-number: ${{ steps.release.outputs.release-pr-number }}
      release-pr-url: ${{ steps.release.outputs.release-pr-url }}
      release-branch: ${{ steps.release.outputs.release-branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.target-sha }}

      # Fetch the maintainer action at the exact commit of this reusable
      # workflow (job.workflow_sha), so the action version always matches the
      # workflow ref the caller pinned — no mutable cross-repo action
      # reference.
      - name: Checkout the action at the workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository || 'ThreatFlux/github_actions' }}
          ref: ${{ job.workflow_sha }}
          path: .release-action
          persist-credentials: false

      # The token is limited to this repository and to what the run needs:
      # contents for the release commit, tag, and Release; pull requests only
      # in create-pr mode; actions only when it will dispatch workflows.
      - name: Create GitHub App installation token
        id: github-app-token
        if: inputs.github-app-id != '' && env.HAS_GITHUB_APP_PRIVATE_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.github-app-id }}
          private-key: ${{ secrets.github-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: ${{ inputs.create-pr && 'write' || '' }}
          permission-actions: ${{ inputs.dispatch-on-app-token && 'write' || '' }}

      - name: Validate GitHub App configuration
        if: (inputs.github-app-id == '') != (env.HAS_GITHUB_APP_PRIVATE_KEY == 'false')
        run: |
          echo "github-app-id and github-app-private-key must be configured together" >&2
          exit 1

      # Every write (the release commit, the release-branch update, the
      # release pull request, the tag, and the GitHub Release) uses this one
      # token. With the App token the release pull request and the tag are
      # ordinary events that start the caller's workflows; GITHUB_TOKEN's
      # would not.
      - name: Release
        id: release
        uses: ./.release-action
        with:
          command: release
          token: ${{ steps.github-app-token.outputs.token || secrets.release-token || github.token }}
          bump: ${{ inputs.bump }}
          tag-prefix: ${{ inputs.tag-prefix }}
          update-major-alias: ${{ inputs.update-major-alias }}
          notes-file: ${{ inputs.notes-file }}
          dry-run: ${{ inputs.dry-run }}
          create-pr: ${{ inputs.create-pr }}
          release-branch: ${{ inputs.release-branch }}
      # scripts/dispatch_release_workflows.py (tested in this repository)
      # decides from RELEASED_BY: an App-pushed tag already started the
      # caller's tag workflows, so it skips and says why unless
      # dispatch-on-app-token is set; release-token and GITHUB_TOKEN releases
      # dispatch on the new tag.
      #
      # A dry run never reports released=true, so this step cannot fire for
      # one; the explicit dry-run check keeps that true even if a runtime that
      # mishandles the flag is ever pinned.
      - name: Dispatch downstream release workflows
        if: steps.release.outputs.released == 'true' && !inputs.dry-run && inputs.dispatch-workflows != ''
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token || secrets.release-token || github.token }}
          RELEASED_BY: >-
            ${{ steps.github-app-token.outcome == 'success' && 'github-app' || env.HAS_RELEASE_TOKEN == 'true' && 'release-token' || 'github-token' }}
          DISPATCH_FOR_APP_RELEASE: ${{ inputs.dispatch-on-app-token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          DISPATCH_WORKFLOWS: ${{ inputs.dispatch-workflows }}
          VERSION_WORKFLOW: ${{ inputs.dispatch-version-workflow }}
        run: python3 .release-action/scripts/dispatch_release_workflows.py

      # Dry runs only log what the dispatch step would do; --plan-only never
      # runs gh.
      - name: Show the downstream dispatch plan (dry run)
        if: inputs.dry-run && inputs.dispatch-workflows != ''
        env:
          RELEASED_BY: >-
            ${{ steps.github-app-token.outcome == 'success' && 'github-app' || env.HAS_RELEASE_TOKEN == 'true' && 'release-token' || 'github-token' }}
          DISPATCH_FOR_APP_RELEASE: ${{ inputs.dispatch-on-app-token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          DISPATCH_WORKFLOWS: ${{ inputs.dispatch-workflows }}
          VERSION_WORKFLOW: ${{ inputs.dispatch-version-workflow }}
        run: python3 .release-action/scripts/dispatch_release_workflows.py --plan-only
