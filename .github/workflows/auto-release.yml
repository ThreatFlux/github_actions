name: Auto Release

concurrency:
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}
  cancel-in-progress: false
  queue: max

# A release runs in two phases, because a container action cannot pin a runtime
# image built from its own release: docker.yml derives version tags from the git
# tag, so an image for the released version only exists once the tag does.
# Phase 1 opens the version-bump PR. Its reviewed merge starts the normal
# main checks and image build. Phase 2 opens a PR for the signed image pins,
# then tags the reviewed main commit once the pins and exact-head checks pass.
on:
  workflow_run:
    # Docker gates phase 1: it proves an image exists for the commit being
    # released, which phase 1 pins so this workflow runs a current binary.
    workflows: ["CI", "Security", "Docker"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      phase:
        description: Release phase; auto detects a committed but untagged version
        required: true
        default: auto
        type: choice
        options:
          - auto
          - bump
          - tag

permissions:
  contents: read

jobs:
  check:
    name: Check for Release
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: >-
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      target_sha: ${{ steps.target.outputs.sha }}
      phase: ${{ steps.target.outputs.phase }}
      version: ${{ steps.target.outputs.version }}
    steps:
      # Everything keys off the branch head rather than the triggering commit: a
      # pending version bump only exists at the head, and the release CLI
      # publishes from the head and skips when it moved mid-run anyway.
      - name: Determine target SHA and phase
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_PHASE: ${{ github.event.inputs.phase || 'auto' }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid head SHA '${sha}'" >&2
            exit 1
          fi
          version="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/Cargo.toml?ref=${sha}" --jq .content \
              | base64 -d | grep -m1 '^version = ' | sed -E 's/^version = "(.*)"$/\1/'
          )"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid manifest version '${version}' at ${sha}" >&2
            exit 1
          fi

          # A manifest version with no tag means phase 1 already committed the
          # bump, so this run finishes that release instead of starting another.
          if response="$(gh api --include --silent "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}")"; then
            detected=bump
          else
            status="$(awk '/^HTTP\// { status=$2 } END { print status }' <<< "${response}")"
            if [[ "${status}" != 404 ]]; then
              echo "release tag lookup failed with HTTP ${status:-unavailable}; refusing to infer absence" >&2
              exit 1
            fi
            detected=tag
          fi
          phase="${REQUESTED_PHASE}"
          if [[ "${phase}" == "auto" ]]; then
            phase="${detected}"
          fi

          skip=false
          if [[ "${phase}" == tag && "${detected}" == bump ]]; then
            echo "v${version} already exists; the requested tag phase is a no-op"
            skip=true
          fi
          echo "head=${sha} manifest=${version} detected=${detected} phase=${phase}"
          {
            echo "skip=${skip}"
            echo "sha=${sha}"
            echo "version=${version}"
            echo "phase=${phase}"
          } >> "$GITHUB_OUTPUT"

      - name: Check CI status
        if: steps.target.outputs.skip != 'true'
        id: ci_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PHASE: ${{ steps.target.outputs.phase }}
        run: |
          set -euo pipefail
          # The Docker handoff can dispatch us just before its own run finishes.
          # Wait briefly for that completion, without exempting the tag phase
          # from any gate. A newer failed rerun supersedes an earlier success.
          attempts=1
          if [[ "${PHASE}" == tag ]]; then attempts=21; fi
          for ((attempt=1; attempt<=attempts; attempt++)); do
            main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            if [[ "${main_sha}" != "${TARGET_SHA}" ]]; then
              echo "main advanced; a new run must validate its new head"
              break
            fi
            all_passed=true
            terminal_failure=false
            for workflow in ci security docker; do
              # PR and scheduled runs cannot substitute for these main checks.
              # jq variables are intentionally literal, not shell expansions.
              # shellcheck disable=SC2016
              status="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow="${workflow}.yml" \
                --branch=main --commit="${TARGET_SHA}" --limit=100 \
                --json event,status,conclusion,attempt,startedAt,createdAt,databaseId --jq '
                def epoch:
                  if type == "string" then (try fromdateiso8601 catch null) else null end;
                def validation_time:
                  if (.attempt | type) != "number" then null
                  elif .attempt < 1 or (.attempt | floor) != .attempt then null
                  elif (.createdAt | epoch) == null then null
                  elif .attempt == 1 then (.createdAt | epoch)
                  elif (.startedAt | epoch) == null then null
                  elif (.startedAt | epoch) < (.createdAt | epoch) then null
                  else (.startedAt | epoch) end;
                # Completion order is not validation order. REST startedAt resets
                # on rerun; ordinary runs keep their creation-time ordering.
                if type != "array" then "completed:unverifiable"
                elif length >= 100 then "completed:truncated"
                else [.[] | select(.event == "push" or .event == "workflow_dispatch")] as $eligible
                | if ($eligible | length) == 0 then "missing"
                  # A queued rerun can still expose the previous start time.
                  elif any($eligible[]; .status != "completed") then "in_flight"
                  else [$eligible[] | . + {validation_time: validation_time}] as $timed
                  | if any($timed[]; .validation_time == null) then "completed:unverifiable"
                    else ($timed | map(.validation_time) | max) as $latest
                    | if all($timed[] | select(.validation_time == $latest); .conclusion == "success")
                      then "completed:success" else "completed:failure" end
                    end
                  end
                end')"
              echo "${workflow}=${status}"
              if [[ "${status}" != completed:success ]]; then
                all_passed=false
                if [[ "${status}" == completed:* ]]; then terminal_failure=true; fi
              fi
            done
            if [[ "${all_passed}" == true ]]; then
              echo "all_passed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "${terminal_failure}" == true || "${attempt}" == "${attempts}" ]]; then break; fi
            sleep 30
          done
          echo "all_passed=false" >> "$GITHUB_OUTPUT"

      - name: Decide whether to attempt a release
        id: decide
        env:
          ALL_PASSED: ${{ steps.ci_status.outputs.all_passed }}
        run: |
          # The release CLI itself no-ops when no conventional commit warrants
          # a release, so this gate only enforces green CI, Security, and Docker
          # runs — including for manual dispatches.
          if [[ "${ALL_PASSED}" == "true" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Create Release
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: write
      packages: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.target_sha }}
          fetch-depth: 0

      - name: Select stable Buildx for digest promotion
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver: docker

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Resolve the runtime image for this commit
        id: runtime
        env:
          TARGET_SHA: ${{ needs.check.outputs.target_sha }}
        run: |
          set -euo pipefail
          repo_path="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short="${TARGET_SHA:0:7}"
          token="$(curl -fsSL "https://ghcr.io/token?scope=repository:${repo_path}:pull&service=ghcr.io" | jq -r .token)"
          # The short-SHA tag is mutable — scheduled rebuilds re-push it — so
          # resolve it to a digest, which is immutable once committed.
          digest="$(
            curl -fsSL -o /dev/null -D - \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo_path}/manifests/${short}" \
              | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }'
          )"
          if [[ -z "${digest}" ]]; then
            echo "no published ghcr.io/${repo_path} image tagged ${short}; refusing to release a mismatched runtime" >&2
            exit 1
          fi
          {
            echo "image=ghcr.io/${repo_path}"
            echo "digest=${digest}"
            echo "short=${short}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the signed runtime and select the release phase
        id: verified_runtime
        env:
          HEAD_DIGEST: ${{ steps.runtime.outputs.digest }}
          PHASE: ${{ needs.check.outputs.phase }}
          TARGET_SHA: ${{ needs.check.outputs.target_sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: bash scripts/select_release_runtime.sh

      - name: Pin proposal runtime images to the resolved digest
        if: steps.verified_runtime.outputs.ready_to_tag != 'true'
        id: runtime_pin
        env:
          IMAGE: ${{ steps.runtime.outputs.image }}
          DIGEST: ${{ steps.verified_runtime.outputs.digest }}
          REF_TAG: ${{ needs.check.outputs.phase == 'tag' && needs.check.outputs.version || steps.runtime.outputs.short }}
          PIN_FILES: runtime/Dockerfile release/Dockerfile
        run: |
          set -euo pipefail
          for file in ${PIN_FILES}; do
            [[ -f "${file}" ]] || { echo "missing ${file}" >&2; exit 1; }
            sed -i -E "s|^FROM [^[:space:]]+|FROM ${IMAGE}:${REF_TAG}@${DIGEST}|" "${file}"
            grep -m1 '^FROM ' "${file}"
          done
          echo "files=${PIN_FILES// /,}" >> "$GITHUB_OUTPUT"

      - name: Check for an existing proposal from this main commit
        if: steps.verified_runtime.outputs.ready_to_tag != 'true'
        id: proposal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.check.outputs.target_sha }}
          BRANCH: ${{ needs.check.outputs.phase == 'tag' && 'automation/release/runtime' || 'automation/release/version' }}
          BUMP: ${{ github.event.inputs.version_bump || 'auto' }}
        run: |
          set -euo pipefail
          existing="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base=main -f "head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" \
            --jq '.[0].head.sha // empty')"
          if [[ -n "${existing}" && "${BUMP}" == auto ]]; then
            parent="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${existing}" --jq '.parents[0].sha // empty')"
            if [[ "${parent}" == "${TARGET_SHA}" ]]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Create a release proposal App token
        if: steps.verified_runtime.outputs.ready_to_tag != 'true' && steps.proposal.outputs.reuse != 'true'
        id: proposal_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.TF_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or refresh the reviewed release proposal
        id: propose
        if: steps.verified_runtime.outputs.ready_to_tag != 'true' && steps.proposal.outputs.reuse != 'true'
        uses: ./
        with:
          command: release
          token: ${{ steps.proposal_token.outputs.token }}
          expected-head: ${{ needs.check.outputs.target_sha }}
          bump: ${{ github.event.inputs.version_bump || 'auto' }}
          phase: ${{ needs.check.outputs.phase }}
          create-pr: "true"
          release-branch: ${{ steps.proposal.outputs.branch }}
          extra-files: ${{ needs.check.outputs.phase == 'tag' && steps.runtime_pin.outputs.files || '' }}

      - name: Report the release proposal
        if: steps.propose.outputs.release-pr-url != ''
        env:
          URL: ${{ steps.propose.outputs.release-pr-url }}
        run: echo "Release proposal ${URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and publish the committed version
        id: release
        if: steps.verified_runtime.outputs.ready_to_tag == 'true'
        uses: ./
        with:
          command: release
          token: ${{ secrets.GITHUB_TOKEN }}
          expected-head: ${{ needs.check.outputs.target_sha }}
          update-major-alias: "true"
          phase: tag
          create-pr: "true"

      # Refusals (existing tag, manifest behind latest, or changed head) must
      # never mutate registry aliases. The publisher rechecks the tag after
      # phase detection; only its confirmed release enables this write.
      - name: Tag the verified image with the release version
        if: steps.release.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_IMAGE: ${{ steps.runtime.outputs.image }}
          EXPECTED_DIGEST: ${{ steps.verified_runtime.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/promote_release_image.sh

      # Tags created with GITHUB_TOKEN do not trigger tag-push workflows, so
      # dispatch the tag pipeline explicitly (workflow_dispatch is exempt from
      # that suppression). Only the binaries need building; the runtime image
      # for this version is already published and tagged above.
      - name: Trigger tag pipelines
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f version="$VERSION"
