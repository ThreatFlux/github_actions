name: Organization Rust Control Tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/org-rust/**
      - .github/workflows/org-rust-*.yml
  push:
    branches: [main]
    paths:
      - .github/org-rust/**
      - .github/workflows/org-rust-*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Rust control-plane regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Exercise official-source, adapter, permission and expected-head boundaries
        run: python3 -m unittest discover -s .github/org-rust/tests -p 'test_*.py' -v
